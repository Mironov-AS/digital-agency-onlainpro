<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="gqr1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="gqr2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="gqr3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="20" fill="url(#gqr2)"/>
  <ellipse cx="60" cy="60" rx="45" ry="45" fill="#22d3ee" fill-opacity="0.06"/>
  <!-- QR Frame -->
  <rect x="22" y="22" width="76" height="76" rx="6" fill="none" stroke="url(#gqr3)" stroke-width="3"/>
  <!-- QR Modules - Position Pattern Top-Left -->
  <rect x="30" y="30" width="22" height="22" rx="2" fill="#a855f7"/>
  <rect x="34" y="34" width="14" height="14" rx="1" fill="#1a1a2e"/>
  <rect x="37" y="37" width="8" height="8" rx="1" fill="#a855f7"/>
  <!-- QR Modules - Position Pattern Top-Right -->
  <rect x="68" y="30" width="22" height="22" rx="2" fill="#a855f7"/>
  <rect x="72" y="34" width="14" height="14" rx="1" fill="#1a1a2e"/>
  <rect x="75" y="37" width="8" height="8" rx="1" fill="#a855f7"/>
  <!-- QR Modules - Position Pattern Bottom-Left -->
  <rect x="30" y="68" width="22" height="22" rx="2" fill="#a855f7"/>
  <rect x="34" y="72" width="14" height="14" rx="1" fill="#1a1a2e"/>
  <rect x="37" y="75" width="8" height="8" rx="1" fill="#a855f7"/>
  <!-- QR Data Modules -->
  <rect x="56" y="30" width="6" height="6" rx="1" fill="#22d3ee">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="56" y="40" width="6" height="6" rx="1" fill="#22d3ee" fill-opacity="0.7"/>
  <rect x="56" y="50" width="6" height="6" rx="1" fill="#22d3ee" fill-opacity="0.5"/>
  <rect x="68" y="56" width="6" height="6" rx="1" fill="#22d3ee" fill-opacity="0.6"/>
  <rect x="68" y="68" width="6" height="6" rx="1" fill="#22d3ee">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="80" y="56" width="6" height="6" rx="1" fill="#22d3ee" fill-opacity="0.8"/>
  <rect x="80" y="68" width="6" height="6" rx="1" fill="#22d3ee" fill-opacity="0.5"/>
  <rect x="92" y="68" width="6" height="6" rx="1" fill="#22d3ee"/>
  <rect x="56" y="80" width="6" height="6" rx="1" fill="#22d3ee" fill-opacity="0.7"/>
  <rect x="74" y="80" width="6" height="6" rx="1" fill="#22d3ee" fill-opacity="0.6"/>
  <rect x="86" y="80" width="6" height="6" rx="1" fill="#22d3ee">
    <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  <!-- Phone icon -->
  <rect x="80" y="14" width="24" height="38" rx="4" fill="#1a1a2e" stroke="url(#gqr3)" stroke-width="2"/>
  <rect x="83" y="20" width="18" height="24" rx="2" fill="#0a0a0f"/>
  <circle cx="92" cy="47" r="2" fill="#22d3ee"/>
  <!-- Scan line animation -->
  <rect x="26" y="56" width="68" height="2" fill="#22d3ee" opacity="0.8">
    <animate attributeName="y" values="26;88;26" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>