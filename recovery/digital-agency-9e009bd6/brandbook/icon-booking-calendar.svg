<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="gbc1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="gbc2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="gbc3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="20" fill="url(#gbc2)"/>
  <ellipse cx="60" cy="60" rx="45" ry="45" fill="#22d3ee" fill-opacity="0.08"/>
  <!-- Calendar body -->
  <rect x="22" y="32" width="76" height="68" rx="8" fill="#1a1a2e" stroke="url(#gbc3)" stroke-width="2"/>
  <!-- Calendar header -->
  <rect x="22" y="32" width="76" height="18" rx="8" fill="url(#gbc3)" fill-opacity="0.3"/>
  <!-- Calendar rings -->
  <rect x="36" y="26" width="6" height="14" rx="3" fill="#a855f7"/>
  <rect x="78" y="26" width="6" height="14" rx="3" fill="#a855f7"/>
  <!-- Date grid -->
  <rect x="30" y="58" width="10" height="10" rx="2" fill="#22d3ee" fill-opacity="0.5"/>
  <rect x="44" y="58" width="10" height="10" rx="2" fill="#22d3ee" fill-opacity="0.3"/>
  <rect x="58" y="58" width="10" height="10" rx="2" fill="#22d3ee" fill-opacity="0.3"/>
  <rect x="72" y="58" width="10" height="10" rx="2" fill="#a855f7"/>
  <rect x="30" y="72" width="10" height="10" rx="2" fill="#22d3ee" fill-opacity="0.3"/>
  <rect x="44" y="72" width="10" height="10" rx="2" fill="#22d3ee" fill-opacity="0.5"/>
  <rect x="58" y="72" width="10" height="10" rx="2" fill="#22d3ee" fill-opacity="0.3"/>
  <rect x="72" y="72" width="10" height="10" rx="2" fill="#22d3ee" fill-opacity="0.3"/>
  <!-- Selected date highlight -->
  <circle cx="77" cy="63" r="6" fill="#a855f7" filter="url(#gbc1)">
    <animate attributeName="r" values="6;7;6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <!-- Clock -->
  <circle cx="82" cy="40" r="4" fill="#22d3ee" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>