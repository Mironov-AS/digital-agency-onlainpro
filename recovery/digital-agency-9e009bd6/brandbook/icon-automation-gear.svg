<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="gag1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="gag2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="gag3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="20" fill="url(#gag2)"/>
  <ellipse cx="60" cy="60" rx="45" ry="45" fill="#22d3ee" fill-opacity="0.06"/>
  <!-- Main gear -->
  <g filter="url(#gag1)">
    <path d="M60 22 L65 30 L75 28 L76 38 L85 42 L82 52 L90 58 L84 66 L90 74 L82 80 L85 90 L75 88 L65 94 L60 102 L55 94 L45 88 L35 90 L38 80 L30 74 L22 66 L28 58 L20 52 L17 42 L26 38 L27 28 L37 30 L45 22 L55 22 L60 22 Z" fill="url(#gag3)">
      <animateTransform attributeName="transform" type="rotate" from="0 60 60" to="360 60 60" dur="8s" repeatCount="indefinite"/>
    </path>
    <circle cx="60" cy="60" r="15" fill="#1a1a2e"/>
    <circle cx="60" cy="60" r="10" fill="url(#gag3)"/>
  </g>
  <!-- Small gear -->
  <g filter="url(#gag1)">
    <path d="M95 15 L98 20 L105 18 L106 25 L112 28 L110 35 L116 40 L112 46 L116 52 L110 56 L112 63 L105 62 L98 66 L95 72 L92 66 L85 62 L78 63 L80 56 L74 52 L70 46 L74 40 L68 35 L66 28 L72 25 L73 18 L80 20 L83 15 L88 15 L95 15 Z" fill="#a855f7" fill-opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="360 95 42" to="0 95 42" dur="5s" repeatCount="indefinite"/>
    </path>
    <circle cx="95" cy="42" r="8" fill="#1a1a2e"/>
    <circle cx="95" cy="42" r="5" fill="#a855f7"/>
  </g>
  <!-- Connection dots -->
  <circle cx="78" cy="32" r="3" fill="#22d3ee">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="42" cy="78" r="3" fill="#a855f7">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <!-- Sparkles -->
  <circle cx="25" cy="55" r="2" fill="#67e8f9">
    <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="95" cy="85" r="2" fill="#c084fc">
    <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="85" cy="95" r="2" fill="#22d3ee">
    <animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>