<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-crm" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <linearGradient id="bg-crm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    
    <linearGradient id="chart-purple" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    
    <linearGradient id="chart-cyan" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    
    <linearGradient id="dashboard-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161d"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    
    <linearGradient id="pie-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="120" height="120" rx="28" fill="url(#bg-crm)"/>
  
  <!-- Dashboard frame -->
  <rect x="15" y="20" width="90" height="80" rx="8" fill="url(#dashboard-bg)" stroke="url(#pie-gradient)" stroke-width="1.5"/>
  
  <!-- Top bar -->
  <rect x="15" y="20" width="90" height="16" rx="8" fill="#27272a"/>
  <rect x="15" y="28" width="90" height="8" fill="#27272a"/>
  <circle cx="25" cy="28" r="3" fill="#ef4444"/>
  <circle cx="35" cy="28" r="3" fill="#eab308"/>
  <circle cx="45" cy="28" r="3" fill="#22c55e"/>
  
  <!-- Bar chart -->
  <g transform="translate(22, 42)">
    <rect x="0" y="25" width="10" height="20" rx="2" fill="url(#chart-purple)" filter="url(#glow-crm)">
      <animate attributeName="height" values="20;25;20" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="25;20;25" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="14" y="15" width="10" height="30" rx="2" fill="url(#chart-cyan)" filter="url(#glow-crm)">
      <animate attributeName="height" values="30;35;30" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="15;10;15" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="28" y="20" width="10" height="25" rx="2" fill="url(#chart-purple)" filter="url(#glow-crm)">
      <animate attributeName="height" values="25;30;25" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="20;15;20" dur="1.8s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Pie chart -->
  <g transform="translate(72, 65)">
    <circle r="22" fill="#16161d" stroke="#27272a" stroke-width="1"/>
    <!-- Pie segments -->
    <path d="M0 0 L0 -20 A20 20 0 0 1 17.32 10 Z" fill="url(#chart-purple)" filter="url(#glow-crm)"/>
    <path d="M0 0 L17.32 10 A20 20 0 0 1 -17.32 10 Z" fill="url(#chart-cyan)" filter="url(#glow-crm)"/>
    <path d="M0 0 L-17.32 10 A20 20 0 0 1 0 -20 Z" fill="#27272a"/>
    <!-- Center -->
    <circle r="8" fill="#0a0a0f"/>
    <circle r="4" fill="#22d3ee" filter="url(#glow-crm)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Floating data points -->
  <circle cx="22" cy="15" r="3" fill="#a855f7" filter="url(#glow-crm)">
    <animate attributeName="cy" values="15;12;15" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="98" cy="25" r="2.5" fill="#22d3ee" filter="url(#glow-crm)">
    <animate attributeName="cy" values="25;22;25" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Trend line -->
  <polyline points="25,92 40,88 55,90 70,82 85,78 100,75" stroke="url(#pie-gradient)" stroke-width="2" fill="none" stroke-linecap="round" filter="url(#glow-crm)"/>
  <circle cx="100" cy="75" r="3" fill="#22d3ee" filter="url(#glow-crm)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite"/>
  </circle>
</svg>
