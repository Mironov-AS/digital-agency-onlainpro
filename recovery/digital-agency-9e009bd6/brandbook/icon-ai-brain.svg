<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-ai" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <linearGradient id="bg-ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    
    <linearGradient id="brain-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    
    <linearGradient id="neural-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    
    <radialGradient id="brain-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="synapse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="120" height="120" rx="28" fill="url(#bg-ai)"/>
  
  <!-- Ambient glow -->
  <circle cx="60" cy="60" r="50" fill="url(#brain-glow)"/>
  
  <!-- Neural network connections -->
  <g stroke="url(#synapse-grad)" stroke-width="1.5" opacity="0.6">
    <line x1="35" y1="40" x2="50" y2="50">
      <animate attributeName="stroke-dashoffset" values="10;0;10" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="50" y1="50" x2="70" y2="45">
      <animate attributeName="stroke-dashoffset" values="10;0;10" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="70" y1="45" x2="85" y2="55">
      <animate attributeName="stroke-dashoffset" values="10;0;10" dur="1.8s" repeatCount="indefinite"/>
    </line>
    <line x1="50" y1="50" x2="45" y2="70">
      <animate attributeName="stroke-dashoffset" values="10;0;10" dur="2.2s" repeatCount="indefinite"/>
    </line>
    <line x1="45" y1="70" x2="60" y2="75">
      <animate attributeName="stroke-dashoffset" values="10;0;10" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <line x1="60" y1="75" x2="80" y2="70">
      <animate attributeName="stroke-dashoffset" values="10;0;10" dur="2.3s" repeatCount="indefinite"/>
    </line>
    <line x1="35" y1="65" x2="45" y2="70">
      <animate attributeName="stroke-dashoffset" values="10;0;10" dur="1.7s" repeatCount="indefinite"/>
    </line>
    <line x1="80" y1="70" x2="90" y2="65">
      <animate attributeName="stroke-dashoffset" values="10;0;10" dur="2.1s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Brain outline -->
  <path d="M60 25 C75 25 90 35 90 55 C90 70 80 80 70 85 C75 90 70 100 55 100 C40 100 35 90 40 80 C30 80 20 70 20 55 C20 35 40 25 60 25 Z" fill="url(#brain-purple)" opacity="0.3" filter="url(#glow-ai)"/>
  
  <!-- Brain hemisphere left -->
  <path d="M60 30 C45 30 35 40 35 55 C35 70 45 80 55 82 C50 88 45 95 55 98 C40 95 30 82 30 62 C30 42 42 30 60 30 Z" fill="url(#brain-purple)" opacity="0.8"/>
  
  <!-- Brain hemisphere right -->
  <path d="M60 30 C75 30 85 40 85 55 C85 70 75 80 65 82 C70 88 75 95 65 98 C80 95 90 82 90 62 C90 42 78 30 60 30 Z" fill="url(#brain-purple)" opacity="0.8"/>
  
  <!-- Brain folds -->
  <path d="M45 45 Q55 40 65 48" stroke="#0a0a0f" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M40 60 Q55 55 70 62" stroke="#0a0a0f" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M50 75 Q60 70 75 78" stroke="#0a0a0f" stroke-width="2" fill="none" opacity="0.5"/>
  
  <!-- Neural nodes -->
  <circle cx="35" cy="40" r="5" fill="url(#neural-cyan)" filter="url(#glow-ai)">
    <animate attributeName="r" values="5;6;5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="50" r="6" fill="url(#neural-cyan)" filter="url(#glow-ai)">
    <animate attributeName="r" values="6;7;6" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="70" cy="45" r="5" fill="url(#neural-cyan)" filter="url(#glow-ai)">
    <animate attributeName="r" values="5;6;5" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="45" cy="70" r="5" fill="url(#neural-cyan)" filter="url(#glow-ai)">
    <animate attributeName="r" values="5;6;5" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="75" r="6" fill="url(#neural-cyan)" filter="url(#glow-ai)">
    <animate attributeName="r" values="6;7;6" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="70" r="5" fill="url(#neural-cyan)" filter="url(#glow-ai)">
    <animate attributeName="r" values="5;6;5" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="85" cy="55" r="4" fill="#c084fc" filter="url(#glow-ai)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Pulse rings -->
  <circle cx="60" cy="60" r="30" stroke="#22d3ee" stroke-width="1" fill="none" opacity="0">
    <animate attributeName="r" values="20;45" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
