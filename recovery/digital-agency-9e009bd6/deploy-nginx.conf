error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    sendfile    on;
    keepalive_timeout  65;
    gzip  on;
    gzip_types  text/plain text/css application/json application/javascript text/xml application/xml;

    # ── Upstreams ────────────────────────────────────────────────────────────
    # ВАЖНО: Используем имена Docker-контейнеров, НЕ 127.0.0.1
    # Nginx работает в отдельном контейнере и должен обращаться к сервисам по их Docker hostname
    
    upstream queue_service {
        server queue-service:3001;
    }
    upstream auth_service {
        server auth-service:4001;
    }
    upstream catalog_service {
        server catalog-service:4002;
    }
    upstream clients_service {
        server clients-service:4003;
    }
    upstream projects_service {
        server projects-service:4004;
    }
    upstream admin_service {
        server admin-service:4005;
    }
    upstream product_shelf_service {
        server product-shelf-service:4006;
    }
    upstream booking_service {
        server booking-service:4008;
    }
    upstream crm_service {
        server crm-service:4009;
    }
    upstream erp_service {
        server erp-service:4010;
    }
    upstream store_service {
        server store-service:4011;
    }
    upstream furniture_photo_sorter_service {
        server furniture-photo-sorter-service:4012;
    }
    upstream label_merger_service {
        server 127.0.0.1:4013;
    }

    server {
        listen 3000;

        # ── Queue Service ─────────────────────────────────────────────────────
        location /api/auth/ {
            proxy_pass         http://auth_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /api/catalog/ {
            proxy_pass         http://catalog_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /api/services {
            proxy_pass         http://queue_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /api/service-fields {
            proxy_pass         http://queue_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /api/tickets {
            proxy_pass         http://queue_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /api/queue {
            proxy_pass         http://queue_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /api/stats {
            proxy_pass         http://queue_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /api/ads {
            proxy_pass         http://queue_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /api/users {
            proxy_pass         http://queue_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /api/settings {
            proxy_pass         http://queue_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /api/qrcode {
            proxy_pass         http://queue_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /api/logs {
            proxy_pass         http://queue_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /socket.io/ {
            proxy_pass         http://queue_service;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # ── Queue Service: static assets (built Vite client, base=/queue/) ──
        location /queue/assets/ {
            alias /repo/services/queue-service/server/public/assets/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ── Queue Service: uploaded files ────────────────────────────────────
        location /queue/uploads/ {
            alias /repo/services/queue-service/server/uploads/;
            add_header Cache-Control "public, max-age=0";
        }

        # ── Queue Service: SPA routes ────────────────────────────────────────
        location /queue/ {
            proxy_pass         http://queue_service/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location = /api/clients {
            proxy_pass         http://clients_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /api/clients/ {
            proxy_pass         http://clients_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location = /api/projects {
            proxy_pass         http://projects_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /api/projects/ {
            proxy_pass         http://projects_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /api/admin/ {
            proxy_pass         http://admin_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location = /api/product-shelf {
            proxy_pass         http://product_shelf_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /api/product-shelf/ {
            proxy_pass         http://product_shelf_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /api/products {
            proxy_pass         http://clients_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /api/crm/ {
            proxy_pass         http://crm_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location = /crm {
            return 301 /crm/;
        }
        location /crm/ {
            proxy_pass         http://crm_service/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /api/erp/ {
            proxy_pass         http://erp_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location = /erp {
            return 301 /erp/;
        }
        location /erp/ {
            proxy_pass         http://erp_service/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /api/store/ {
            proxy_pass         http://store_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location = /store {
            return 301 /store/;
        }
        location /store/ {
            proxy_pass         http://store_service/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /api/furniture-sorter/ {
            proxy_pass         http://furniture_photo_sorter_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location = /furniture-sorter {
            return 301 /furniture-sorter/;
        }
        location /furniture-sorter/ {
            proxy_pass         http://furniture_photo_sorter_service/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /api/booking/ {
            proxy_pass         http://booking_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /api/label-merger/ {
            proxy_pass         http://label_merger_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location = /booking {
            return 301 /booking/;
        }

        location /booking/ {
            proxy_pass         http://booking_service/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location = /app {
            return 301 /app/;
        }

        location /app/ {
            root   /usr/share/nginx/html;
            try_files $uri $uri/ /app/index.html;
        }

        location = /client-portal {
            return 301 /client-portal/;
        }

        location /client-portal/ {
            root   /usr/share/nginx/html;
            try_files $uri $uri/ /client-portal/index.html;
        }

        # ── Static assets for each SPA (must be before SPA fallbacks) ─────────
        location /assets/ {
            alias /usr/share/nginx/html/landing/assets/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /app/assets/ {
            alias /usr/share/nginx/html/app/assets/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /client-portal/assets/ {
            alias /usr/share/nginx/html/client-portal/assets/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ── Landing: multi-page SEO routes ────────────────────────────────────
        location ~ ^/product/queue/?$ {
            alias /usr/share/nginx/html/landing/product-queue.html;
            default_type text/html;
        }
        location ~ ^/product/crm-light/?$ {
            alias /usr/share/nginx/html/landing/product-crm-light.html;
            default_type text/html;
        }
        location ~ ^/product/booking/?$ {
            alias /usr/share/nginx/html/landing/product-booking.html;
            default_type text/html;
        }
        location ~ ^/product/erp-light/?$ {
            alias /usr/share/nginx/html/landing/product-erp-light.html;
            default_type text/html;
        }
        location ~ ^/product/store-management/?$ {
            alias /usr/share/nginx/html/landing/product-store.html;
            default_type text/html;
        }
        location ~ ^/product/furniture-photo-sorter/?$ {
            alias /usr/share/nginx/html/landing/product-furniture-photo-sorter.html;
            default_type text/html;
        }
        location ~ ^/about/?$ {
            alias /usr/share/nginx/html/landing/about.html;
            default_type text/html;
        }
        location ~ ^/cases/?$ {
            alias /usr/share/nginx/html/landing/cases.html;
            default_type text/html;
        }

        location / {
            root   /usr/share/nginx/html/landing;
            try_files $uri $uri/ /index.html;
        }
    }
}
