<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="favicon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <linearGradient id="fav-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    
    <linearGradient id="fav-inner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    
    <linearGradient id="fav-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#0a0a0f"/>
  
  <!-- Hexagon logo -->
  <g filter="url(#favicon-glow)">
    <!-- Background glow -->
    <circle cx="32" cy="32" r="28" fill="#22d3ee" opacity="0.1"/>
    
    <!-- Outer hexagon -->
    <polygon points="32,6 54,16 54,48 32,58 10,48 10,16" fill="none" stroke="url(#fav-grad)" stroke-width="2"/>
    
    <!-- Inner hexagon -->
    <polygon points="32,14 47,21 47,43 32,50 17,43 17,21" fill="url(#fav-inner)" opacity="0.5"/>
    
    <!-- Core hexagon -->
    <polygon points="32,22 40,26 40,38 32,42 24,38 24,26" fill="url(#fav-cyan)" opacity="0.9">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </polygon>
    
    <!-- Center -->
    <circle cx="32" cy="32" r="4" fill="white" opacity="0.5">
      <animate attributeName="r" values="3;5;3" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Corner nodes -->
    <circle cx="32" cy="6" r="2" fill="#a855f7">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="54" cy="16" r="1.5" fill="#22d3ee">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="54" cy="48" r="2" fill="#c084fc">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="32" cy="58" r="1.5" fill="#22d3ee">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="10" cy="48" r="2" fill="#a855f7">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="10" cy="16" r="1.5" fill="#67e8f9">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
