<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Glow filter -->
    <filter id="glow-web" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Gradient backgrounds -->
    <linearGradient id="bg-web" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    
    <linearGradient id="purple-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    
    <!-- Radial glow -->
    <radialGradient id="radial-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="120" height="120" rx="28" fill="url(#bg-web)"/>
  
  <!-- Ambient glow -->
  <ellipse cx="60" cy="70" rx="50" ry="40" fill="url(#radial-glow)"/>
  
  <!-- Monitor frame -->
  <rect x="20" y="28" width="80" height="52" rx="6" fill="#16161d" stroke="url(#purple-cyan)" stroke-width="2"/>
  
  <!-- Screen -->
  <rect x="26" y="34" width="68" height="40" rx="3" fill="#0a0a0f"/>
  
  <!-- Code lines on screen -->
  <rect x="32" y="42" width="28" height="3" rx="1.5" fill="#a855f7" opacity="0.9"/>
  <rect x="32" y="50" width="42" height="3" rx="1.5" fill="#22d3ee" opacity="0.7"/>
  <rect x="32" y="58" width="20" height="3" rx="1.5" fill="#a855f7" opacity="0.5"/>
  <rect x="56" y="58" width="32" height="3" rx="1.5" fill="#67e8f9" opacity="0.5"/>
  
  <!-- Monitor stand -->
  <path d="M52 80 L52 88 L44 96 L76 96 L68 88 L68 80" fill="#16161d"/>
  <rect x="44" y="96" width="32" height="4" rx="2" fill="#27272a"/>
  
  <!-- Floating elements -->
  <circle cx="88" cy="30" r="4" fill="#a855f7" filter="url(#glow-web)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="94" cy="42" r="2" fill="#22d3ee" filter="url(#glow-web)">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="18" cy="50" r="3" fill="#c084fc" filter="url(#glow-web)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Cursor -->
  <path d="M72 48 L72 64 L78 58 L84 68 L88 65 L82 55 L88 55 Z" fill="url(#purple-cyan)" filter="url(#glow-web)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="1s" repeatCount="indefinite"/>
  </path>
</svg>
