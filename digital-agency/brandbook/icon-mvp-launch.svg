<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-mvp" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <linearGradient id="bg-mvp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    
    <linearGradient id="mvp-rocket" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    
    <linearGradient id="mvp-flame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    
    <radialGradient id="thrust-glow" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="120" height="120" rx="28" fill="url(#bg-mvp)"/>
  
  <!-- Speed lines -->
  <g opacity="0.4">
    <line x1="10" y1="30" x2="50" y2="30" stroke="#a855f7" stroke-width="2" stroke-linecap="round">
      <animate attributeName="x1" values="10;20;10" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <line x1="5" y1="50" x2="40" y2="50" stroke="#22d3ee" stroke-width="2" stroke-linecap="round">
      <animate attributeName="x1" values="5;15;5" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="1.2s" repeatCount="indefinite"/>
    </line>
    <line x1="8" y1="70" x2="45" y2="70" stroke="#c084fc" stroke-width="2" stroke-linecap="round">
      <animate attributeName="x1" values="8;18;8" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="1.8s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Thrust trail -->
  <ellipse cx="60" cy="95" rx="20" ry="25" fill="url(#thrust-glow)">
    <animate attributeName="ry" values="25;30;25" dur="0.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="0.3s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Rocket body -->
  <path d="M60 20 C60 20 80 40 80 65 L80 75 L40 75 L40 65 C40 40 60 20 60 20 Z" fill="url(#mvp-rocket)" filter="url(#glow-mvp)"/>
  
  <!-- Rocket nose -->
  <path d="M60 15 C60 15 70 30 70 35 L50 35 C50 30 60 15 60 15 Z" fill="#c084fc"/>
  
  <!-- Rocket window -->
  <circle cx="60" cy="50" r="10" fill="#0a0a0f" stroke="#22d3ee" stroke-width="2"/>
  <circle cx="60" cy="50" r="6" fill="#22d3ee" opacity="0.3"/>
  <circle cx="58" cy="48" r="2" fill="#67e8f9"/>
  
  <!-- Rocket fins -->
  <path d="M40 65 L25 80 L25 85 L40 75 Z" fill="#7c3aed"/>
  <path d="M80 65 L95 80 L95 85 L80 75 Z" fill="#7c3aed"/>
  
  <!-- Rocket flames -->
  <path d="M48 75 L55 95 L60 85 L65 95 L72 75" fill="url(#mvp-flame)" filter="url(#glow-mvp)">
    <animate attributeName="d" values="M48 75 L55 95 L60 85 L65 95 L72 75;M48 75 L53 100 L60 88 L67 100 L72 75;M48 75 L55 95 L60 85 L65 95 L72 75" dur="0.2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Sparkles -->
  <circle cx="30" cy="35" r="2" fill="#67e8f9" filter="url(#glow-mvp)">
    <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="40" r="2.5" fill="#c084fc" filter="url(#glow-mvp)">
    <animate attributeName="opacity" values="0;1;0" dur="1.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="25" cy="55" r="1.5" fill="#22d3ee" filter="url(#glow-mvp)">
    <animate attributeName="opacity" values="0;1;0" dur="0.8s" repeatCount="indefinite"/>
  </circle>
</svg>
