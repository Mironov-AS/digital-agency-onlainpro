<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-queue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <linearGradient id="bg-queue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    
    <linearGradient id="ticket-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    
    <linearGradient id="ticket-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    
    <linearGradient id="display-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#16161d"/>
    </linearGradient>
    
    <clipPath id="ticket-cut">
      <path d="M0 20 L0 100 Q0 110 10 110 L110 110 Q120 110 120 100 L120 20 Q120 10 110 10 L10 10 Q0 10 0 20 Z"/>
    </clipPath>
  </defs>
  
  <!-- Background -->
  <rect width="120" height="120" rx="28" fill="url(#bg-queue)"/>
  
  <!-- Digital display board -->
  <rect x="15" y="12" width="90" height="35" rx="6" fill="url(#display-bg)" stroke="#27272a" stroke-width="1.5"/>
  
  <!-- Current number -->
  <text x="35" y="37" font-family="Inter, sans-serif" font-size="20" font-weight="800" fill="#22d3ee" filter="url(#glow-queue)">
    A
    <animate attributeName="opacity" values="1;0.5;1" dur="1s" repeatCount="indefinite"/>
  </text>
  <text x="60" y="37" font-family="Inter, sans-serif" font-size="20" font-weight="800" fill="#a855f7">
    047
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" repeatCount="indefinite"/>
  </text>
  
  <!-- Next indicator -->
  <rect x="90" y="20" width="10" height="18" rx="2" fill="#22c55e" filter="url(#glow-queue)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="0.8s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Ticket 1 (current) -->
  <g transform="translate(20, 55)">
    <path d="M0 8 L0 52 Q0 58 6 58 L74 58 Q80 58 80 52 L80 8 Q80 2 74 2 L6 2 Q0 2 0 8 Z" fill="url(#ticket-cyan)" filter="url(#glow-queue)"/>
    <!-- Dashed line -->
    <line x1="0" y1="18" x2="80" y2="18" stroke="#0a0a0f" stroke-width="1" stroke-dasharray="4 3" opacity="0.3"/>
    <!-- QR placeholder -->
    <rect x="8" y="24" width="20" height="20" rx="2" fill="#0a0a0f" opacity="0.5"/>
    <rect x="11" y="27" width="5" height="5" fill="#22d3ee"/>
    <rect x="20" y="27" width="5" height="5" fill="#22d3ee"/>
    <rect x="11" y="36" width="5" height="5" fill="#22d3ee"/>
    <!-- Number -->
    <text x="38" y="32" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#0a0a0f">ТАЛОН</text>
    <text x="38" y="48" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#0a0a0f">A-047</text>
    <!-- Corner notch top -->
    <circle cx="0" cy="8" r="4" fill="#1a1a2e"/>
    <!-- Corner notch bottom -->
    <circle cx="0" cy="52" r="4" fill="#1a1a2e"/>
  </g>
  
  <!-- Ticket 2 (waiting) -->
  <g transform="translate(30, 65) scale(0.7)">
    <path d="M0 8 L0 52 Q0 58 6 58 L74 58 Q80 58 80 52 L80 8 Q80 2 74 2 L6 2 Q0 2 0 8 Z" fill="url(#ticket-purple)" opacity="0.5"/>
    <text x="38" y="35" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#a855f7">A-048</text>
    <circle cx="0" cy="8" r="4" fill="#1a1a2e"/>
    <circle cx="0" cy="52" r="4" fill="#1a1a2e"/>
  </g>
  
  <!-- Ticket 3 (waiting) -->
  <g transform="translate(45, 72) scale(0.5)">
    <path d="M0 8 L0 52 Q0 58 6 58 L74 58 Q80 58 80 52 L80 8 Q80 2 74 2 L6 2 Q0 2 0 8 Z" fill="url(#ticket-purple)" opacity="0.3"/>
    <text x="38" y="35" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#c084fc">A-049</text>
    <circle cx="0" cy="8" r="4" fill="#1a1a2e"/>
    <circle cx="0" cy="52" r="4" fill="#1a1a2e"/>
  </g>
  
  <!-- Glow particles -->
  <circle cx="95" cy="18" r="2" fill="#22d3ee" filter="url(#glow-queue)">
    <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="105" cy="30" r="1.5" fill="#a855f7" filter="url(#glow-queue)">
    <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="15" cy="95" r="2" fill="#67e8f9" filter="url(#glow-queue)">
    <animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>
