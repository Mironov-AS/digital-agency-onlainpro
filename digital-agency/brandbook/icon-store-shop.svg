<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="gst1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="gst2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="gst3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="20" fill="url(#gst2)"/>
  <ellipse cx="60" cy="60" rx="45" ry="45" fill="#22d3ee" fill-opacity="0.06"/>
  <!-- Store building -->
  <rect x="26" y="40" width="68" height="55" rx="4" fill="#1a1a2e" stroke="url(#gst3)" stroke-width="2"/>
  <!-- Roof -->
  <path d="M20 40 L60 22 L100 40" stroke="url(#gst3)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Awning stripes -->
  <path d="M26 48 L26 60 L34 60 L34 48 Z" fill="#a855f7" fill-opacity="0.4"/>
  <path d="M38 48 L38 60 L46 60 L46 48 Z" fill="#22d3ee" fill-opacity="0.4"/>
  <path d="M50 48 L50 60 L58 60 L58 48 Z" fill="#a855f7" fill-opacity="0.4"/>
  <path d="M62 48 L62 60 L70 60 L70 48 Z" fill="#22d3ee" fill-opacity="0.4"/>
  <path d="M74 48 L74 60 L82 60 L82 48 Z" fill="#a855f7" fill-opacity="0.4"/>
  <path d="M86 48 L86 60 L94 60 L94 48 Z" fill="#22d3ee" fill-opacity="0.4"/>
  <!-- Door -->
  <rect x="50" y="68" width="20" height="27" rx="2" fill="#0a0a0f" stroke="#a855f7" stroke-width="1.5"/>
  <circle cx="66" cy="82" r="2" fill="#22d3ee">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <!-- Windows -->
  <rect x="30" y="54" width="14" height="12" rx="2" fill="#22d3ee" fill-opacity="0.2" stroke="#22d3ee" stroke-width="1"/>
  <rect x="76" y="54" width="14" height="12" rx="2" fill="#22d3ee" fill-opacity="0.2" stroke="#22d3ee" stroke-width="1"/>
  <!-- Shelf items -->
  <rect x="32" y="56" width="4" height="8" rx="1" fill="#a855f7"/>
  <rect x="38" y="58" width="4" height="6" rx="1" fill="#22d3ee"/>
  <rect x="78" y="56" width="4" height="8" rx="1" fill="#a855f7"/>
  <rect x="84" y="58" width="4" height="6" rx="1" fill="#22d3ee"/>
  <!-- Sign -->
  <rect x="38" y="28" width="44" height="14" rx="3" fill="#0a0a0f" stroke="url(#gst3)" stroke-width="1.5"/>
  <text x="60" y="38" text-anchor="middle" fill="#fff" font-size="8" font-weight="bold">SHOP</text>
  <!-- Shopping bag -->
  <path d="M88 70 L92 70 L92 86 L88 86 Z" fill="#a855f7"/>
  <path d="M86 70 L94 70 L94 72 L86 72 Z" fill="#a855f7"/>
  <path d="M88 74 Q90 78 92 74" stroke="#22d3ee" stroke-width="1.5" fill="none"/>
  <!-- Sparkles -->
  <circle cx="20" cy="30" r="2" fill="#67e8f9">
    <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="25" r="2.5" fill="#c084fc">
    <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>