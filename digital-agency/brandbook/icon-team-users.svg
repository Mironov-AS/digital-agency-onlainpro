<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="gtu1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="gtu2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="gtu3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="20" fill="url(#gtu2)"/>
  <ellipse cx="60" cy="60" rx="45" ry="45" fill="#a855f7" fill-opacity="0.06"/>
  <!-- Center user (main) -->
  <circle cx="60" cy="42" r="14" fill="url(#gtu3)" filter="url(#gtu1)"/>
  <circle cx="56" cy="39" r="3" fill="#fff"/>
  <circle cx="64" cy="39" r="3" fill="#fff"/>
  <path d="M54 46 Q60 52 66 46" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Center body -->
  <ellipse cx="60" cy="78" rx="18" ry="14" fill="url(#gtu3)"/>
  <!-- Left user -->
  <circle cx="30" cy="50" r="10" fill="#a855f7" fill-opacity="0.6"/>
  <ellipse cx="30" cy="80" rx="12" ry="10" fill="#a855f7" fill-opacity="0.6"/>
  <!-- Right user -->
  <circle cx="90" cy="50" r="10" fill="#22d3ee" fill-opacity="0.6">
    <animate attributeName="r" values="10;11;10" dur="2s" repeatCount="indefinite"/>
  </circle>
  <ellipse cx="90" cy="80" rx="12" ry="10" fill="#22d3ee" fill-opacity="0.6"/>
  <!-- Connection lines -->
  <path d="M44 48 Q52 40 60 38" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.6">
    <animate attributeName="stroke-dashoffset" values="0;8" dur="1s" repeatCount="indefinite"/>
  </path>
  <path d="M76 48 Q68 40 60 38" stroke="#22d3ee" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.6">
    <animate attributeName="stroke-dashoffset" values="8;0" dur="1s" repeatCount="indefinite"/>
  </path>
  <!-- Pulse rings -->
  <circle cx="60" cy="60" r="35" stroke="url(#gtu3)" stroke-width="2" fill="none" opacity="0.3">
    <animate attributeName="r" values="35;45;35" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <!-- Stars -->
  <circle cx="20" cy="30" r="2" fill="#67e8f9">
    <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="30" r="2" fill="#c084fc">
    <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="100" r="2" fill="#22d3ee">
    <animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>