worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    upstream auth_service          { server auth-service:4001; }
    upstream catalog_service       { server catalog-service:4002; }
    upstream clients_service       { server clients-service:4003; }
    upstream projects_service      { server projects-service:4004; }
    upstream admin_service         { server admin-service:4005; }
    upstream product_shelf_service { server product-shelf-service:4006; }
    upstream queue_service         { server queue-service:3001; }
    upstream booking_service       { server booking-service:4008; }
    upstream crm_service           { server crm-service:4009; }
    upstream furniture_sorter_service { server furniture-photo-sorter-service:4012; }
    upstream erp_service           { server erp-service:4010; }
    upstream store_service         { server store-service:4011; }
    upstream label_merger_service  { server label-merger-service:4013; }
    upstream navi_logs_service     { server navi-logs:3005; }

    server {
        listen 80;
        server_name _;

        location /api/auth/ {
            proxy_pass         http://auth_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /api/catalog/ {
            proxy_pass         http://catalog_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /api/clients/ {
            proxy_pass         http://clients_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /api/projects/ {
            proxy_pass         http://projects_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /api/admin/ {
            proxy_pass         http://admin_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /api/product-shelf/ {
            proxy_pass         http://product_shelf_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /api/crm/ {
            proxy_pass         http://crm_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /api/furniture-sorter/ {
            proxy_pass         http://furniture_sorter_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /api/label-merger/ {
            proxy_pass         http://label_merger_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # --- CRM Light frontend ---
        location = /crm {
            return 301 /crm/;
        }
        location /crm/ {
            proxy_pass         http://crm_service/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # /api/products живёт в clients-service (он сам проксирует в product-shelf)
        location /api/products {
            proxy_pass         http://clients_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # --- Электронная очередь (queue-service) ---
        location /api/services {
            proxy_pass         http://queue_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
        location /api/service-fields {
            proxy_pass         http://queue_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
        location /api/tickets {
            proxy_pass         http://queue_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
        location /api/queue {
            proxy_pass         http://queue_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
        location /api/stats {
            proxy_pass         http://queue_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
        location /api/ads {
            proxy_pass         http://queue_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
        location /api/users {
            proxy_pass         http://queue_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
        location /api/settings {
            proxy_pass         http://queue_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
        location /api/qrcode {
            proxy_pass         http://queue_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
        location /api/logs {
            proxy_pass         http://queue_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
        location /socket.io/ {
            proxy_pass         http://queue_service;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
        location = /queue {
            return 301 /queue/;
        }
        location /queue/ {
            proxy_pass         http://queue_service/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # --- Электронная запись (booking-service) ---
        location /api/booking/ {
            proxy_pass         http://booking_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
        location = /booking {
            return 301 /booking/;
        }
        location /booking/ {
            proxy_pass         http://booking_service/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # --- ERP (erp-service) ---
        location /api/erp/ {
            proxy_pass         http://erp_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
        location = /erp {
            return 301 /erp/;
        }
        location /erp/ {
            proxy_pass         http://erp_service/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # --- Store (store-service) ---
        location /api/store/ {
            proxy_pass         http://store_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
        location = /store {
            return 301 /store/;
        }
        location /store/ {
            proxy_pass         http://store_service/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # Frontend: SPA /app/*
        location /app {
            root   /usr/share/nginx/html;
            try_files $uri $uri/ /app/index.html;
        }

        # --- OSM Navigator Logs (navi-logs) ---
        location = /navi {
            return 301 /navi/;
        }
        location /navi/ {
            proxy_pass         http://navi_logs_service/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
        location /api/navi-logs/ {
            proxy_pass         http://navi_logs_service/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # Landing (/)
        location / {
            root   /usr/share/nginx/html/landing;
            try_files $uri $uri/ /index.html;
        }
    }
}
